<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后室中文维基 | 官方数据库</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .wiki-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .wiki-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .wiki-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: var(--transition);
    }
    .wiki-card:hover {
      border-color: var(--accent-dim);
      transform: translateY(-2px);
      box-shadow: var(--glow);
    }
    .wiki-card:hover::before { opacity: 1; }
    .wiki-card.hidden-entry { opacity: 0.6; }
    .wiki-card.hidden-entry:hover { opacity: 1; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 16px; color: var(--fg); }
    .card-category { font-size: 10px; padding: 2px 8px; background: var(--accent-dim); color: var(--accent); border-radius: 4px; font-family: var(--mono); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .card-tag { font-size: 10px; padding: 2px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--fg-dim); font-family: var(--mono); }
    .card-excerpt { font-size: 13px; color: var(--fg-muted); line-height: 1.6; }
    .card-footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-link { font-size: 12px; color: var(--accent); font-family: var(--mono); }
    .card-link:hover { color: var(--accent-bright); }
    .hidden-badge { font-size: 9px; color: var(--danger); background: var(--danger-dim); padding: 2px 6px; border-radius: 3px; font-family: var(--mono); }
    
    .entry-detail {
      max-width: 800px;
      margin: 0 auto;
    }
    .entry-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .entry-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .entry-tag { font-size: 11px; padding: 3px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--fg-muted); font-family: var(--mono); }
    .entry-content { line-height: 1.8; }
    .entry-content h3 { color: var(--accent); margin-top: 24px; }
    .entry-content .hint { font-size: 12px; color: var(--fg-dim); font-style: italic; margin-top: 16px; }
    .entry-content .cipher { color: var(--accent-bright); font-weight: 600; }
    .entry-content .freq, .entry-content .lock, .entry-content .code { 
      background: var(--accent-dim); color: var(--accent); padding: 1px 6px; border-radius: 3px; font-family: var(--mono); font-size: 12px;
    }
    
    .search-hint {
      background: var(--bg-elevated);
      border: 1px dashed var(--accent-dim);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--fg-muted);
    }
    .search-hint code { background: var(--accent-dim); color: var(--accent); }
    
    .logo-click-hint {
      position: fixed;
      bottom: 80px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 11px;
      color: var(--fg-dim);
      font-family: var(--mono);
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      z-index: 50;
    }
    .logo-click-hint.visible { opacity: 1; }
    
    .awakened-indicator {
      position: fixed;
      top: 60px;
      right: 24px;
      background: var(--success-dim);
      border: 1px solid var(--success);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--success);
      font-family: var(--mono);
      opacity: 0;
      transform: translateX(100px);
      transition: var(--transition);
      z-index: 50;
    }
    .awakened-indicator.visible { opacity: 1; transform: translateX(0); }
    
    .countdown-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .countdown-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      width: 0%;
      transition: width 1s linear;
    }
    
    .notification-bubble {
      position: fixed;
      bottom: 100px;
      left: 24px;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: var(--glow);
      z-index: 100;
      animation: fade-in 0.3s ease;
      max-width: 280px;
      display: none;
    }
    .notification-bubble.visible { display: block; }
    .notification-bubble.minimized { 
      padding: 8px 12px; 
      bottom: 24px; 
      left: 24px;
      cursor: pointer;
    }
    .notification-bubble.minimized .notification-body { display: none; }
    
    @keyframes bounce-in {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .notification-bubble.visible { animation: bounce-in 0.4s ease; }
  </style>
  <!-- WQFWS//ANNEX · 五片碎片散在五个页面的源码里，序号写在碎片自己身上 -->
</head>
<body class="app">
  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-area" id="logo-link">
        <img src="assets/logo/厨得快1.png" alt="Logo" class="logo-img" id="header-logo">
        <span class="site-title">后室中文维基</span>
      </a>
      
      <div class="search-area">
        <input type="text" class="search-input" id="search-input" placeholder="搜索层级、实体、物品、组织..." autocomplete="off" spellcheck="false">
        <div class="search-results" id="search-results"></div>
      </div>
      
      <nav class="category-nav">
        <a href="index.html" class="nav-item">首页</a>
        <a href="live.html" class="nav-item" id="live-nav-link" style="display:none;">内测预约</a>
        <a href="mail.html" class="nav-item" id="mail-nav-link" style="display:none;">内部邮箱</a>
        <a href="terminal.html" class="nav-item" id="terminal-nav-link" style="display:none;">终端</a>
        <a href="archive.html" class="nav-item" id="archive-nav-link" style="display:none;">机密档案</a>
        <a href="cipher.html" class="nav-item" id="cipher-nav-link" style="display:none;">密钥本</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <!-- Default: Wiki Home -->
    <div id="wiki-home" class="wiki-home">
      <div class="search-hint">
        <strong>💡 搜索提示：</strong> 支持按标题、分类、标签搜索。<br>
        <strong>隐藏机制：</strong> 精准输入特定 <code>Chef ID</code> 可解锁隐藏档案。
      </div>
      
      <div class="wiki-grid" id="wiki-grid"></div>
    </div>

    <!-- Entry Detail View -->
    <div id="entry-detail" class="entry-detail hidden">
      <a href="#" class="card-link" id="back-to-list">← 返回列表</a>
      <article id="entry-content"></article>
    </div>
  </main>

  <!-- UI Overlays -->
  <div class="logo-click-hint" id="logo-click-hint">Logo 点击计数: <span id="logo-click-count">0</span>/7</div>
  <div class="awakened-indicator" id="awakened-indicator">🔓 LEVEL A AWAKENED</div>
  
  <div class="notification-bubble" id="live-notification">
    <div class="notification-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="color:var(--accent);font-family:var(--mono);font-size:11px;">直播预约</span>
      <button class="notification-minimize" id="minimize-notification" style="background:none;border:none;color:var(--fg-dim);cursor:pointer;font-size:14px;line-height:1;">−</button>
    </div>
    <div class="notification-body">
      <div style="font-size:13px;margin-bottom:8px;">距离「厨得快官方内测直播」开启还有：</div>
      <div class="countdown-bar"><div class="countdown-fill" id="countdown-fill"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--fg-muted);">
        <span id="countdown-text">计算中...</span>
        <button class="btn small primary" id="enter-live-room" style="display:none;">进入直播间</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="simple-site-footer">
    后室中文维基 · 非官方镜像站 · 数据来源：M.E.G. 公开档案 · <span class="mono">wqfws-arg-state-v1</span>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { loadState, set, get, setMany, has, shouldShowLiveNotification, getScheduledLiveTime, generateEmailCredentials } from './state.js';
    import { route, navigate, initRouter, createLink } from './router.js';
    import { WIKI_ENTRIES, searchWiki, getEntryById } from './data/wiki.js';
    
    // ========== State & Helpers ==========
    const state = loadState();
    let logoClickCount = 0;
    let countdownInterval = null;
    let notificationCheckInterval = null;
    
    // ========== DOM Elements ==========
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const wikiGrid = document.getElementById('wiki-grid');
    const wikiHome = document.getElementById('wiki-home');
    const entryDetail = document.getElementById('entry-detail');
    const entryContent = document.getElementById('entry-content');
    const backToList = document.getElementById('back-to-list');
    const logoLink = document.getElementById('logo-link');
    const logoClickHint = document.getElementById('logo-click-hint');
    const logoClickCountEl = document.getElementById('logo-click-count');
    const awakenedIndicator = document.getElementById('awakened-indicator');
    const liveNotification = document.getElementById('live-notification');
    const countdownFill = document.getElementById('countdown-fill');
    const countdownText = document.getElementById('countdown-text');
    const enterLiveRoomBtn = document.getElementById('enter-live-room');
    const minimizeNotification = document.getElementById('minimize-notification');
    const liveNavLink = document.getElementById('live-nav-link');
    const mailNavLink = document.getElementById('mail-nav-link');
    const terminalNavLink = document.getElementById('terminal-nav-link');
    const archiveNavLink = document.getElementById('archive-nav-link');
    const cipherNavLink = document.getElementById('cipher-nav-link');
    
    // ========== Logo Click Handler (Awakening) ==========
    logoLink.addEventListener('click', (e) => {
      // Only count clicks on the logo image/title, not navigation
      if (e.target.closest('.nav-item')) return;
      
      logoClickCount++;
      logoClickCountEl.textContent = logoClickCount;
      logoClickHint.classList.add('visible');
      
      if (logoClickCount >= 7 && !state.awakened) {
        set('awakened', true);
        awakenedIndicator.classList.add('visible');
        showToast('LEVEL A 觉醒', '最高机密权限已解锁。机密档案库现已可访问。', 'success');
        updateNavVisibility();
        renderWikiGrid(); // Re-render to show deep layer entries
      }
      
      // Hide hint after 3 seconds
      setTimeout(() => logoClickHint.classList.remove('visible'), 3000);
    });
    
    // ========== Search ==========
    let searchDebounce = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        const query = searchInput.value.trim();
        if (query) {
          set('wikiLastQuery', query);
          set('wikiSearchCount', (state.wikiSearchCount || 0) + 1);
          performSearch(query);
        } else {
          searchResults.classList.remove('open');
          renderWikiGrid();
        }
      }, 150);
    });
    
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim()) performSearch(searchInput.value.trim());
    });
    
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-area')) {
        searchResults.classList.remove('open');
      }
    });
    
    function performSearch(query) {
      const results = searchWiki(query, state);
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="search-result-item" style="color:var(--fg-dim);text-align:center;">无匹配结果</div>';
      } else {
        searchResults.innerHTML = results.map(r => `
          <div class="search-result-item" data-id="${r.id}">
            <div class="result-title">${r.title} ${r.hidden ? '<span class="hidden-badge">隐藏</span>' : ''}</div>
            <div class="result-meta">
              <span class="result-tag">${r.category}</span>
              ${r.tags.slice(0,2).map(t => `<span class="result-tag">${t}</span>`).join('')}
            </div>
          </div>
        `).join('');
      }
      searchResults.classList.add('open');
      
      // Check for hidden entry unlock
      if (query.toLowerCase() === 'ellis 蒋' && !state.hiddenEntryUnlocked) {
        set('hiddenEntryUnlocked', true);
        showToast('隐藏档案解锁', '检测到签约主厨 Ellis 蒋。隐藏菜谱档案已加载。', 'warning');
        renderWikiGrid();
      }
      
      // 密钥本：第二条入手路径（第一条是导播组误发的邮件）
      if (query.trim() === '密钥本' && !state.cipherBookUnlocked) {
        set('cipherBookUnlocked', true);
        state.cipherBookUnlocked = true;
        updateNavVisibility();
        showToast('密钥本已授权', '检索命中内部培训资料。导航栏已出现「密钥本」入口。', 'warning');
      }
    }
    
    searchResults.addEventListener('click', (e) => {
      const item = e.target.closest('.search-result-item');
      if (item) {
        const id = item.dataset.id;
        showEntry(id);
        searchResults.classList.remove('open');
        searchInput.value = '';
      }
    });
    
    // ========== Wiki Rendering ==========
    function renderWikiGrid() {
      const awakened = state.awakened;
      const entries = WIKI_ENTRIES.filter(e => {
        if (e.hidden && !awakened && !e.requiresAwakened) return false;
        if (e.requiresAwakened && !awakened) return false;
        return true;
      });
      
      wikiGrid.innerHTML = entries.map(e => `
        <div class="wiki-card ${e.hidden ? 'hidden-entry' : ''}" data-id="${e.id}">
          <div class="card-header">
            <span class="card-title">${e.title}</span>
            <span class="card-category">${e.category}</span>
          </div>
          <div class="card-tags">
            ${e.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
          </div>
          <div class="card-excerpt">${getExcerpt(e.content)}</div>
          <div class="card-footer">
            <span class="card-link">查看详情 →</span>
            ${e.hidden ? '<span class="hidden-badge">机密</span>' : ''}
          </div>
        </div>
      `).join('');
      
      wikiGrid.querySelectorAll('.wiki-card').forEach(card => {
        card.addEventListener('click', () => showEntry(card.dataset.id));
      });
    }
    
    function getExcerpt(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      const text = div.textContent || div.innerText || '';
      return text.slice(0, 120) + '...';
    }
    
    function showEntry(id) {
      const entry = getEntryById(id);
      if (!entry) return;
      
      wikiHome.classList.add('hidden');
      entryDetail.classList.remove('hidden');
      entryContent.innerHTML = `
        <header class="entry-header">
          <h1>${entry.title}</h1>
          <div class="entry-meta">
            <span class="entry-tag">${entry.category}</span>
            ${entry.tags.map(t => `<span class="entry-tag">${t}</span>`).join('')}
            ${entry.hidden ? '<span class="entry-tag badge warning">机密档案</span>' : ''}
            ${entry.requiresAwakened ? '<span class="entry-tag badge danger">需要觉醒</span>' : ''}
          </div>
        </header>
        <div class="entry-content">${entry.content}</div>
      `;
      window.scrollTo(0, 0);
    }
    
    backToList.addEventListener('click', (e) => {
      e.preventDefault();
      entryDetail.classList.add('hidden');
      wikiHome.classList.remove('hidden');
      window.scrollTo(0, 0);
    });
    
    // ========== Navigation Visibility ==========
    function updateNavVisibility() {
      liveNavLink.style.display = state.hiddenEntryUnlocked ? 'inline-block' : 'none';
      mailNavLink.style.display = state.mailCreated ? 'inline-block' : 'none';
      terminalNavLink.style.display = state.pipelineUnlocked ? 'inline-block' : 'none';
      archiveNavLink.style.display = state.awakened ? 'inline-block' : 'none';
      cipherNavLink.style.display = state.cipherBookUnlocked ? 'inline-block' : 'none';
    }
    
    // ========== Live Notification System ==========
    function startNotificationCheck() {
      if (notificationCheckInterval) return;
      notificationCheckInterval = setInterval(() => {
        if (shouldShowLiveNotification() && !state.livePopupShown) {
          showLiveNotification();
        }
        updateCountdown();
      }, 1000);
    }
    
    function showLiveNotification() {
      set('livePopupShown', true);
      liveNotification.classList.add('visible');
      updateCountdown();
    }
    
    function updateCountdown() {
      const scheduledTime = getScheduledLiveTime();
      const now = Date.now();
      const remaining = scheduledTime - now;
      
      if (remaining <= 0) {
        countdownText.textContent = '直播已开始！';
        countdownFill.style.width = '100%';
        enterLiveRoomBtn.style.display = 'inline-flex';
        if (countdownInterval) clearInterval(countdownInterval);
      } else {
        const totalWait = 1200000; // 20 minutes
        const elapsed = totalWait - remaining;
        const pct = Math.min(100, (elapsed / totalWait) * 100);
        countdownFill.style.width = pct + '%';
        
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        countdownText.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      }
    }
    
    minimizeNotification.addEventListener('click', () => {
      liveNotification.classList.toggle('minimized');
      minimizeNotification.textContent = liveNotification.classList.contains('minimized') ? '+' : '−';
      set('liveNoticeMinimized', liveNotification.classList.contains('minimized'));
    });
    
    enterLiveRoomBtn.addEventListener('click', () => {
      navigate('live.html');
    });
    
    // ========== Toast System ==========
    function showToast(title, body, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-title">${title}</div>
        <div class="toast-body">${body}</div>
      `;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fade-in 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
    
    // ========== Route Handlers ==========
    route('index.html', () => {
      wikiHome.classList.remove('hidden');
      entryDetail.classList.add('hidden');
      renderWikiGrid();
      updateNavVisibility();
      startNotificationCheck();
    });
    
    // ========== Initialize ==========
    initRouter();
    renderWikiGrid();
    updateNavVisibility();
    
    // Check if we should show notification on load
    if (shouldShowLiveNotification()) {
      showLiveNotification();
    }
    updateCountdown();
    
    // Show awakened indicator if already awakened
    if (state.awakened) {
      awakenedIndicator.classList.add('visible');
    }
    
    // Debug: expose state
    window.DEBUG_STATE = state;
    console.log('WQFWS ARG - Wiki initialized', state);
  </script>
  <script src="js/trace.js" data-page="档案首页" data-trace="导航栏少一个页面。真正的东西在 robots.txt 的禁止行里。" data-b64="6KKr56aB5q2i55qE56ys5LiA5p2h6Lev5b6E77yM5bCx5piv6Zeo44CC"></script>
</body>
