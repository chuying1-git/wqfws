<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厨得快 - 内测直播间</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Video Stream Overlay Styles */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .video-frame {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .frame-indicator {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.7);
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      z-index: 10;
    }
    
    .phase-badge {
      position: absolute;
      bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7);
      color: var(--success);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      z-index: 10;
    }
    
    .timer-display {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.7);
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 13px;
      z-index: 10;
    }
    
    .chat-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 24px;
      max-height: 400px;
      overflow: hidden;
    }
    
    .chat-header {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--fg-muted);
    }
    
    .chat-messages {
      padding: 8px;
      max-height: 350px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg);
    }
    
    .chat-message {
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 6px;
      max-width: 80%;
    }
    
    .chat-message.bot { background: var(--bg); margin-left: auto; }
    .chat-message.user { background: var(--accent-dim); color: var(--bg); margin-right: auto; text-align: right; }
    
    .input-area {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 12px;
      padding: 12px;
      display: flex;
      gap: 8px;
    }
    
    .input-field {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 12px;
    }
    
    .send-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0 16px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
    }
    
    .send-btn:disabled { background: var(--fg-dim); cursor: not-allowed; }
    
    .kick-timer {
      position: absolute;
      bottom: 60px; left: 20px;
      background: var(--danger-dim);
      color: var(--danger);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      z-index: 10;
    }
    
    .enter-final-btn {
      margin-top: 24px;
      padding: 12px 24px;
      font-size: 14px;
    }
    
    /* Phase transition effects */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(244, 176, 87, 0.3); }
      50% { box-shadow: 0 0 30px rgba(244, 176, 87, 0.5); }
    }
    
    .phase-transition {
      animation: fadeIn 0.5s ease;
    }
    
    /* Stage labels */
    .stage-label {
      display: inline-block;
      padding: 2px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 9px;
      color: var(--fg-muted);
      margin-right: 4px;
    }
    .stage-1 { background: var(--accent-dim); color: var(--accent); }
    .stage-2 { background: rgba(74, 222, 128, 0.2); color: var(--success); }
    .stage-3 { background: var(--danger-dim); color: var(--danger); }
    .stage-4 { background: var(--accent-dim); color: var(--accent); }
  </style>
  <link rel="stylesheet" href="css/deep.css">
  <!-- frag 1/5 · "ga" -->
</head>
<body class="app">
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-area">
        <img src="assets/logo/厨得快1.png" alt="Logo" class="logo-img">
        <span class="site-title">后室中文维基</span>
      </a>
      <div class="search-area" style="max-width:300px;">
        <input type="text" class="search-input" placeholder="搜索..." disabled style="opacity:0.5;">
      </div>
      <nav class="category-nav">
        <a href="index.html" class="nav-item">首页</a>
        <a href="live.html" class="nav-item" style="color:var(--accent);">内测预约</a>
        <a href="room.html" class="nav-item" style="color:var(--accent);">直播间</a>
        <a href="mail.html" class="nav-item" id="mail-nav-link" style="display:none;">内部邮箱</a>
        <a href="terminal.html" class="nav-item" id="terminal-nav-link" style="display:none;">终端</a>
        <a href="cipher.html" class="nav-item">密钥本</a>
        <a href="archive.html" class="nav-item" id="archive-nav-link" style="display:none;">机密档案</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="video-container" id="video-container">
      <!-- Video frames will be injected by JS -->
      <div class="frame-indicator" id="frame-indicator">Phase 1</div>
      <div class="phase-badge" id="phase-badge">Phase: 1/4</div>
      <div class="timer-display" id="timer-display">准备...</div>
      <div class="kick-timer" id="kick-timer" style="display:none;">准备踢出...</div>
      
      <video id="stream-video" class="video-frame" autoplay playsinline>
        <!-- Video source will be set by JS -->
      </video>
    </div>
    
    <div id="stage-indicators">
      <span class="stage-label stage-1">Phase 1：正常帧</span>
      <span class="stage-label stage-2">Phase 2：音频+全黑</span>
      <span class="stage-label stage-3">Phase 3：Logo 变色</span>
      <span class="stage-label stage-4">Phase 4：最终循环</span>
    </div>
    
    <div class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <span>直播聊天</span>
        <span id="chat-count">0</span>条弹幕
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message bot" id="welcome-msg">
          欢迎进入厨得快官方内测直播间<br>
          <span style="color:var(--fg-muted);font-size:11px;">输入弹幕请使用指令 /d 开头</span>
        </div>
      </div>
    </div>
    
    <div class="input-area" id="input-area" style="display:none;">
      <input type="text" class="input-field" id="chat-input" placeholder="输入弹幕...">
      <button class="send-btn" id="send-btn" disabled>发送</button>
    </div>
    
    <button class="enter-final-btn" id="enter-final-btn" style="display:none;">任务完成 → 进入终端</button>
  </main>

  <footer class="simple-site-footer">
    厨得快 · 内测直播间 · <span class="mono">wqfws-arg-state-v1</span>
  </footer>

  <script type="module" src="js/room.js"></script>
  <script src="js/trace.js" data-page="信号" data-trace="帧里的数字不是三位，是十位。" data-frag="1/5 = ga"></script>
</body>
</html>
