<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020604" />
<meta name="robots" content="noindex" />
<title>WQFWS://SECRET-ARCHIVE · 终端管道</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020604'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%236dff9e' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/original.css" />
<link rel="stylesheet" href="css/arg.css" />
<!-- frag 3/5 · "ke" -->
</head>
<body>
  <div class="screen">
    <div class="scanlines"></div>
    <div class="sweep"></div>

    <div class="content">
      <div class="topline">
        <span>WQFWS://SECRET-ARCHIVE <span class="badge" id="tm-badge">PIPELINE</span></span>
        <span class="status"><i></i><span id="tm-status">PIPE · 8 SLOTS</span></span>
      </div>

      <p class="tagline">终端管道 · 八条命令 · <b>每条只有一次机会</b></p>

      <div class="meta">
        <span>USER: guest</span>
        <span>NODE: terminal</span>
        <span>CLEARANCE: OPERATOR</span>
      </div>

      <div class="stations" id="arg-nav"></div>

      <div class="stage-card" style="margin-top:18px;">
        <div class="stage-hd">
          <span class="grow">管道执行台</span>
          <span class="prog" id="tm-prog">0 / 8</span>
        </div>
        <div class="stage-bd">
          <div class="terminal-main">

            <!-- 管道槽位（由 js/terminal.js 渲染） -->
            <div class="pipeline-display" id="pipeline-display"></div>

            <!-- 命令输入 -->
            <div class="command-input" id="command-form">
              <label for="command-input">输入管道命令序列（空格分隔）：</label>
              <textarea class="input-field" id="command-input" rows="3"
                        placeholder="例如: cat grep cut tr base64 tail sort head"></textarea>
              <button class="submit-btn" id="submit-command" disabled>提交验证</button>
              <div id="command-status" style="margin-top:12px;font-size:12px;"></div>
            </div>

            <!-- 错误 trace -->
            <div class="error-state" id="error-state"></div>

            <!-- 成功横幅 -->
            <div class="success-banner" id="success-banner">
              <strong>管道成功。</strong><br>
              所有命令正确执行。权限：访问机密档案库 <a href="archive.html">→</a>
            </div>

            <!-- 提示 -->
            <div class="hint-box">
              卡住了可以要提示，但每次使用都会被记录（<span class="code">hintsUsed</span>）。
              <div style="margin-top:10px;">
                <button class="btn ghost" id="hint-btn" type="button">要一条提示</button>
              </div>
              <div class="hint-bar" id="hint-out"></div>
            </div>

          </div>
        </div>
      </div>

      <div class="foot">终端管道挑战 · <span class="code">wqfws-arg-state-v1</span></div>
    </div>
  </div>

  <script type="module" src="js/terminal.js"></script>
  <script src="js/trace.js" data-page="终端管道" data-trace="八条命令里有两条是陷阱，删掉它们才能通。" data-frag="3/5 = ke"></script>
</body>
</html>
