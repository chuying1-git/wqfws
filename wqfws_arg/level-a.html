<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020604" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="WQFWS // SECRET ARCHIVE · LEVEL A" />
<title>WQFWS // SECRET ARCHIVE · LEVEL A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020604'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%236dff9e' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/original.css" />
<link rel="stylesheet" href="css/arg.css" />
<style>
  .la-sheet {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin: 14px 0 18px;
  }
  .la-cell {
    border: 1px dashed rgba(109,255,158,0.25); border-radius: 8px;
    padding: 12px 6px; text-align: center;
    font-size: 10.5px; color: rgba(109,255,158,0.35); letter-spacing: 0.08em;
  }
  .la-cell.got {
    border-style: solid; border-color: rgba(109,255,158,0.6);
    color: var(--g-bright); background: rgba(109,255,158,0.06);
  }
  .la-night {
    border-left: 2px solid var(--amber); padding: 10px 14px; margin-top: 16px;
    font-size: 12.5px; line-height: 1.9; color: var(--g-dim);
    background: rgba(255,210,125,0.04);
  }
  .la-night b { color: var(--amber); }
  .la-idle { font-size: 12.5px; color: rgba(109,255,158,0.35); margin-top: 16px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="scanlines"></div>
    <div class="sweep"></div>
    <div class="content">
      <div class="topline">
        <span>WQFWS // SECRET ARCHIVE · LEVEL A</span>
        <span class="status"><i></i><span id="la-status">门禁 · 未验证</span></span>
      </div>

      <div class="stage-card" style="margin-top:18px;">
        <div class="stage-hd">
          <span class="grow">LEVEL A · 门禁</span>
          <span class="prog" id="la-prog">0 / 5</span>
        </div>
        <div class="stage-bd" id="level-a-root"></div>
      </div>
    </div>
  </div>

  <script src="js/trace.js" data-page="LEVEL A" data-trace="夜班时段（20:00–04:00）会多出一段记录。"></script>
  <script type="module" src="js/level-a.js"></script>
</body>
</html>
