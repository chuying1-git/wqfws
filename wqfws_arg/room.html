<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020604" />
<meta name="robots" content="noindex" />
<title>WQFWS://SECRET-ARCHIVE · 内测直播间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020604'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%236dff9e' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/original.css" />
<link rel="stylesheet" href="css/arg.css" />
<!-- frag 1/5 · "ga" -->
</head>
<body>
  <div class="screen">
    <div class="scanlines"></div>
    <div class="sweep"></div>

    <div class="content">
      <div class="topline">
        <span>WQFWS://SECRET-ARCHIVE <span class="badge">LIVE</span></span>
        <span class="status"><i></i><span id="pg-status">SIGNAL · 待接入</span></span>
      </div>

      <p class="tagline">内测直播间 · <b>信号未加密，但没人看</b></p>

      <div class="meta">
        <span>USER: guest</span>
        <span>NODE: room</span>
        <span>CLEARANCE: VIEWER</span>
      </div>

      <div class="stations" id="arg-nav"></div>

  <div class="stage-card" style="margin-top:18px;">
        <div class="stage-hd"><span class="grow">直播信号 · 主频 875 Hz</span><span class="prog" id="pg-prog">OFFLINE</span></div>
        <div class="stage-bd">
    <div class="video-container" id="video-container">
      <!-- Video frames will be injected by JS -->
      <div class="frame-indicator" id="frame-indicator">Phase 1</div>
      <div class="phase-badge" id="phase-badge">Phase: 1/4</div>
      <div class="timer-display" id="timer-display">准备...</div>
      <div class="kick-timer" id="kick-timer" style="display:none;">准备踢出...</div>
      
      <video id="stream-video" class="video-frame" autoplay playsinline>
        <!-- Video source will be set by JS -->
      </video>
    </div>
    
    <div id="stage-indicators">
      <span class="stage-label stage-1">Phase 1：正常帧</span>
      <span class="stage-label stage-2">Phase 2：音频+全黑</span>
      <span class="stage-label stage-3">Phase 3：Logo 变色</span>
      <span class="stage-label stage-4">Phase 4：最终循环</span>
    </div>
    
    <div class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <span>直播聊天</span>
        <span id="chat-count">0</span>条弹幕
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message bot" id="welcome-msg">
          欢迎进入官方内测直播间<br>
          <span style="color:var(--fg-muted);font-size:11px;">输入弹幕请使用指令 /d 开头</span>
        </div>
      </div>
    </div>
    
    <div class="input-area" id="input-area" style="display:none;">
      <input type="text" class="input-field" id="chat-input" placeholder="输入弹幕...">
      <button class="send-btn" id="send-btn" disabled>发送</button>
    </div>
    
    <button class="enter-final-btn" id="enter-final-btn" style="display:none;">任务完成 → 进入终端</button>
  </div>
      </div>

        <div class="foot">内测直播间 · <span class="code">wqfws-arg-state-v1</span></div>
    </div>
  </div>

  <script type="module" src="js/room.js"></script>
  <script src="js/trace.js" data-page="信号" data-trace="帧里的数字不是三位，是十位。" data-frag="1/5 = ga"></script>
</body>
</html>
